spring.application.name=distributor-retailer

spring.datasource.url=jdbc:mysql://localhost:3306/distributor_retailer
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

APP_API_USERNAME=${DISTRIBUTOR_API_USERNAME}
APP_API_PASSWORD=${DISTRIBUTOR_API_PASSWORD}